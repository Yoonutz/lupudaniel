<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#1c1517;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;position:relative;color:#faf6f5}
.photo{position:absolute;right:0;top:0;width:520px;height:630px;background:url(photo.jpg) 50% 14%/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1c1517 0%,rgba(28,21,23,.55) 16%,rgba(28,21,23,0) 40%)}
.vf{position:absolute;right:28px;top:28px;width:450px;height:574px}
.vf i{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.85)}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.rec{position:absolute;right:48px;bottom:50px;font:500 18px 'JetBrains Mono',monospace;letter-spacing:.1em;background:rgba(0,0,0,.45);padding:7px 12px}
.rec:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#e5484d;margin-right:10px}
.txt{position:absolute;left:76px;top:0;bottom:0;width:660px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f0a3ad;display:flex;align-items:center;gap:14px;margin-bottom:22px}
.eyebrow:before{content:"";width:40px;height:3px;background:#8b2635}
h1{font-size:86px;font-weight:800;letter-spacing:-.025em;line-height:1;margin-bottom:22px}
.sub{font-size:26px;font-weight:500;color:#d9cfd0;line-height:1.35;margin-bottom:38px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{white-space:nowrap;font-size:20px;font-weight:600;padding:10px 18px;border:1px solid #463b3e;background:rgba(34,28,30,.9);border-radius:0 10px 0 10px;color:#f5efee}
.chip b{color:#f0a3ad;font-weight:800}
.url{position:absolute;left:76px;bottom:44px;font-size:20px;font-weight:600;color:#a6989b;letter-spacing:.02em}
</style></head><body>
<div class="photo"></div><div class="vf"><i></i><i></i><i></i><i></i></div><span class="rec">REC · BRAȘOV</span>
<div class="txt">
<div class="eyebrow">Foto · Video · Design</div>
<h1>Daniel Lupu</h1>
<div class="sub">Fotograf-videograf &amp; designer grafic<br><span style="color:#a6989b">Photographer-videographer &amp; graphic designer</span></div>
<div class="chips"><span class="chip"><b>12+</b> ani design &amp; producție vizuală</span><span class="chip">Brașov, România</span></div>
</div>
<div class="url">lupudaniel.pages.dev</div>
</body></html>
