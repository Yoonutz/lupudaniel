name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [resume, dancapitandeplai]
    defaults:
      run:
        working-directory: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          find public src -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Python syntax
        run: |
          find src -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
      - name: JSON syntax
        run: |
          find src public -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool > /dev/null
